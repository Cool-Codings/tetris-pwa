<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00f5ff;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#00f5ff;stop-opacity:0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="80" fill="url(#bg)"/>

  <!-- Glow effect -->
  <rect x="40" y="40" width="432" height="432" rx="60" fill="url(#glow)"/>

  <!-- T-Piece (Cyan) -->
  <rect x="156" y="80" width="60" height="60" rx="8" fill="#00f5ff"/>
  <rect x="96" y="140" width="60" height="60" rx="8" fill="#00f5ff"/>
  <rect x="156" y="140" width="60" height="60" rx="8" fill="#00f5ff"/>
  <rect x="216" y="140" width="60" height="60" rx="8" fill="#00f5ff"/>

  <!-- L-Piece (Orange) -->
  <rect x="296" y="80" width="60" height="60" rx="8" fill="#ff9f43"/>
  <rect x="296" y="140" width="60" height="60" rx="8" fill="#ff9f43"/>
  <rect x="296" y="200" width="60" height="60" rx="8" fill="#ff9f43"/>
  <rect x="356" y="200" width="60" height="60" rx="8" fill="#ff9f43"/>

  <!-- S-Piece (Green) -->
  <rect x="156" y="220" width="60" height="60" rx="8" fill="#6bcb77"/>
  <rect x="216" y="220" width="60" height="60" rx="8" fill="#6bcb77"/>
  <rect x="96" y="280" width="60" height="60" rx="8" fill="#6bcb77"/>
  <rect x="156" y="280" width="60" height="60" rx="8" fill="#6bcb77"/>

  <!-- O-Piece (Yellow) -->
  <rect x="296" y="280" width="60" height="60" rx="8" fill="#ffd93d"/>
  <rect x="356" y="280" width="60" height="60" rx="8" fill="#ffd93d"/>
  <rect x="296" y="340" width="60" height="60" rx="8" fill="#ffd93d"/>
  <rect x="356" y="340" width="60" height="60" rx="8" fill="#ffd93d"/>

  <!-- I-Piece (Purple) - Bottom -->
  <rect x="96" y="360" width="60" height="60" rx="8" fill="#9b59b6"/>
  <rect x="156" y="360" width="60" height="60" rx="8" fill="#9b59b6"/>
  <rect x="216" y="360" width="60" height="60" rx="8" fill="#9b59b6"/>
  <rect x="276" y="360" width="60" height="60" rx="8" fill="#9b59b6"/>

  <!-- Subtle grid lines -->
  <g stroke="rgba(255,255,255,0.1)" stroke-width="1" fill="none">
    <line x1="96" y1="80" x2="96" y2="420"/>
    <line x1="156" y1="80" x2="156" y2="420"/>
    <line x1="216" y1="80" x2="216" y2="420"/>
    <line x1="276" y1="80" x2="276" y2="420"/>
    <line x1="336" y1="80" x2="336" y2="420"/>
    <line x1="396" y1="80" x2="396" y2="420"/>
  </g>
</svg>
