<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tetris PWA - Icon Generator</title>
    <style>
        body {
            font-family: system-ui, sans-serif;
            background: #1a1a2e;
            color: white;
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
        }
        h1 { color: #00f5ff; }
        .icon-preview {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin: 20px 0;
        }
        .icon-item {
            text-align: center;
        }
        canvas {
            background: #16213e;
            border-radius: 12px;
        }
        button {
            background: linear-gradient(135deg, #00f5ff, #6bcb77);
            color: #1a1a2e;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            margin: 10px;
        }
        button:hover {
            transform: scale(1.05);
        }
        .info {
            background: rgba(0,245,255,0.1);
            border: 1px solid #00f5ff;
            border-radius: 8px;
            padding: 15px;
            margin: 20px 0;
        }
        a { color: #00f5ff; }
    </style>
</head>
<body>
    <h1>🎮 Tetris PWA - Icon Generator</h1>

    <div class="info">
        <p><strong>Anleitung:</strong></p>
        <ol>
            <li>Klicke auf "Alle Icons generieren & herunterladen"</li>
            <li>Entpacke die heruntergeladenen Dateien in den <code>icons/</code> Ordner</li>
            <li>Die App ist dann bereit für die Installation als PWA!</li>
        </ol>
    </div>

    <button onclick="generateAllIcons()">📥 Alle Icons generieren & herunterladen</button>
    <button onclick="generateScreenshot()">📸 Screenshot generieren</button>

    <div class="icon-preview" id="preview"></div>

    <script>
        const SIZES = [72, 96, 128, 144, 152, 192, 384, 512];

        function drawIcon(ctx, size) {
            const scale = size / 512;
            const blockSize = 60 * scale;
            const gap = 4 * scale;
            const radius = 8 * scale;
            const cornerRadius = 80 * scale;

            // Background gradient
            const bgGrad = ctx.createLinearGradient(0, 0, size, size);
            bgGrad.addColorStop(0, '#1a1a2e');
            bgGrad.addColorStop(1, '#16213e');

            // Rounded rectangle background
            ctx.beginPath();
            ctx.roundRect(0, 0, size, size, cornerRadius);
            ctx.fillStyle = bgGrad;
            ctx.fill();

            // Glow effect
            const glowGrad = ctx.createRadialGradient(size/2, size/2, 0, size/2, size/2, size/2);
            glowGrad.addColorStop(0, 'rgba(0, 245, 255, 0.2)');
            glowGrad.addColorStop(1, 'rgba(0, 245, 255, 0)');
            ctx.fillStyle = glowGrad;
            ctx.fill();

            // Helper function to draw a block
            function drawBlock(x, y, color) {
                const px = x * scale;
                const py = y * scale;
                const bs = blockSize - gap;

                ctx.shadowBlur = 10 * scale;
                ctx.shadowColor = color;
                ctx.fillStyle = color;
                ctx.beginPath();
                ctx.roundRect(px, py, bs, bs, radius);
                ctx.fill();

                // Highlight
                ctx.shadowBlur = 0;
                ctx.fillStyle = 'rgba(255,255,255,0.3)';
                ctx.beginPath();
                ctx.roundRect(px + 2*scale, py + 2*scale, bs - 4*scale, bs/3, radius/2);
                ctx.fill();
            }

            // T-Piece (Cyan)
            drawBlock(156, 80, '#00f5ff');
            drawBlock(96, 140, '#00f5ff');
            drawBlock(156, 140, '#00f5ff');
            drawBlock(216, 140, '#00f5ff');

            // L-Piece (Orange)
            drawBlock(296, 80, '#ff9f43');
            drawBlock(296, 140, '#ff9f43');
            drawBlock(296, 200, '#ff9f43');
            drawBlock(356, 200, '#ff9f43');

            // S-Piece (Green)
            drawBlock(156, 220, '#6bcb77');
            drawBlock(216, 220, '#6bcb77');
            drawBlock(96, 280, '#6bcb77');
            drawBlock(156, 280, '#6bcb77');

            // O-Piece (Yellow)
            drawBlock(296, 280, '#ffd93d');
            drawBlock(356, 280, '#ffd93d');
            drawBlock(296, 340, '#ffd93d');
            drawBlock(356, 340, '#ffd93d');

            // I-Piece (Purple)
            drawBlock(96, 360, '#9b59b6');
            drawBlock(156, 360, '#9b59b6');
            drawBlock(216, 360, '#9b59b6');
            drawBlock(276, 360, '#9b59b6');
        }

        function generateIcon(size) {
            const canvas = document.createElement('canvas');
            canvas.width = size;
            canvas.height = size;
            const ctx = canvas.getContext('2d');
            drawIcon(ctx, size);
            return canvas;
        }

        function downloadCanvas(canvas, filename) {
            const link = document.createElement('a');
            link.download = filename;
            link.href = canvas.toDataURL('image/png');
            link.click();
        }

        function generateAllIcons() {
            const preview = document.getElementById('preview');
            preview.innerHTML = '<p>Generiere Icons...</p>';

            SIZES.forEach((size, index) => {
                setTimeout(() => {
                    const canvas = generateIcon(size);
                    downloadCanvas(canvas, `icon-${size}.png`);

                    // Show preview
                    const item = document.createElement('div');
                    item.className = 'icon-item';
                    item.innerHTML = `<p>${size}x${size}</p>`;
                    item.appendChild(canvas);
                    preview.appendChild(item);

                    if (index === 0) {
                        preview.innerHTML = '';
                        preview.appendChild(item);
                    }
                }, index * 300);
            });
        }

        function generateScreenshot() {
            const canvas = document.createElement('canvas');
            canvas.width = 540;
            canvas.height = 720;
            const ctx = canvas.getContext('2d');

            // Background
            const bgGrad = ctx.createLinearGradient(0, 0, 540, 720);
            bgGrad.addColorStop(0, '#1a1a2e');
            bgGrad.addColorStop(1, '#16213e');
            ctx.fillStyle = bgGrad;
            ctx.fillRect(0, 0, 540, 720);

            // Title
            ctx.fillStyle = '#00f5ff';
            ctx.font = 'bold 60px system-ui';
            ctx.textAlign = 'center';
            ctx.fillText('TETRIS', 270, 100);

            // Draw game preview
            const gamePreview = generateIcon(300);
            ctx.drawImage(gamePreview, 120, 150);

            // Score preview
            ctx.fillStyle = '#ffd93d';
            ctx.font = 'bold 24px system-ui';
            ctx.fillText('Score: 12,500', 270, 520);
            ctx.fillText('Level: 5', 270, 560);

            // Download
            downloadCanvas(canvas, 'screenshot-1.png');

            // Preview
            const preview = document.getElementById('preview');
            const item = document.createElement('div');
            item.className = 'icon-item';
            item.innerHTML = '<p>Screenshot</p>';
            item.appendChild(canvas);
            preview.appendChild(item);
        }

        // Generate preview on load
        window.onload = () => {
            const preview = document.getElementById('preview');
            const canvas = generateIcon(192);
            const item = document.createElement('div');
            item.className = 'icon-item';
            item.innerHTML = '<p>Vorschau (192x192)</p>';
            item.appendChild(canvas);
            preview.appendChild(item);
        };
    </script>
</body>
</html>
