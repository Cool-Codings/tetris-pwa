<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="description" content="Tetris PWA - Ein klassisches Puzzle-Spiel für die ganze Familie">
    <meta name="theme-color" content="#1a1a2e">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Tetris">

    <title>Tetris PWA</title>

    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Password Modal -->
    <div id="password-modal" class="password-overlay">
        <div class="password-container">
            <div class="password-icon">🔐</div>
            <h2 class="password-title">Zugang erforderlich</h2>
            <p class="password-subtitle">Bitte Passwort eingeben</p>

            <form id="password-form">
                <div class="password-input-wrapper">
                    <input
                        type="password"
                        id="password-input"
                        class="password-input"
                        placeholder="Passwort..."
                        autocomplete="off"
                        autofocus
                    >
                    <button type="button" id="toggle-password" class="toggle-password-btn">
                        👁️
                    </button>
                </div>

                <div id="password-error" class="password-error hidden">
                    Falsches Passwort!
                </div>

                <label class="remember-checkbox">
                    <input type="checkbox" id="remember-password">
                    <span class="checkmark"></span>
                    <span>Passwort merken</span>
                </label>

                <button type="submit" class="password-submit-btn">
                    Entsperren
                </button>
            </form>
        </div>
    </div>

    <div id="game-container">
        <!-- Start Screen -->
        <div id="start-screen" class="screen active">
            <h1 class="game-title">
                <span class="letter" style="color: #00f5ff;">T</span>
                <span class="letter" style="color: #ff6b6b;">E</span>
                <span class="letter" style="color: #ffd93d;">T</span>
                <span class="letter" style="color: #6bcb77;">R</span>
                <span class="letter" style="color: #9b59b6;">I</span>
                <span class="letter" style="color: #ff9f43;">S</span>
            </h1>
            <div class="title-subtitle">
                <span class="title-for">für</span>
                <span class="title-name" id="title-name"></span>
                <span class="title-cursor"></span>
            </div>

            <!-- Leaderboard on Start Screen -->
            <div class="leaderboard-container" id="start-leaderboard">
                <h3 class="leaderboard-title">🏆 Top 10</h3>
                <div class="leaderboard-list" id="start-leaderboard-list">
                    <!-- Wird dynamisch gefüllt -->
                </div>
            </div>

            <button id="start-button" class="game-button">
                <span>▶ Spiel starten</span>
            </button>
            <button id="sound-toggle" class="game-button secondary">
                <span id="sound-icon">🔊</span>
                <span id="sound-text">Sound An</span>
            </button>
            <div class="controls-info">
                <p><strong>Steuerung:</strong></p>
                <p>📱 Touch: Wischen & Tippen</p>
                <p>⌨️ Tastatur: ←→↓ + ↑/Leertaste</p>
            </div>
        </div>

        <!-- Game Screen -->
        <div id="game-screen" class="screen">
            <div id="game-header">
                <div class="stat-box">
                    <span class="stat-label">Score</span>
                    <span id="score" class="stat-value">0</span>
                </div>
                <div class="stat-box">
                    <span class="stat-label">Level</span>
                    <span id="level" class="stat-value">1</span>
                </div>
                <div class="stat-box">
                    <span class="stat-label">Zeilen</span>
                    <span id="lines" class="stat-value">0</span>
                </div>
            </div>

            <!-- Next Piece & Pause Row -->
            <div id="game-info-row">
                <div class="next-piece-container">
                    <span class="panel-label">Nächstes</span>
                    <canvas id="next-canvas"></canvas>
                </div>
                <button id="pause-button" class="panel-box pause-box">
                    <span class="panel-label">Pause</span>
                    <span class="pause-icon">⏸️</span>
                </button>
            </div>

            <div id="game-area">
                <div id="canvas-container">
                    <canvas id="game-canvas"></canvas>
                    <canvas id="particle-canvas"></canvas>
                    <!-- Announcement Overlay -->
                    <div id="announcement-overlay" class="announcement-overlay hidden">
                        <div class="announcement-sparks"></div>
                        <div class="announcement-text" id="announcement-text"></div>
                        <div class="announcement-sparks"></div>
                    </div>
                </div>
                <!-- Joker Panel -->
                <div id="joker-panel" class="joker-panel">
                    <div class="joker-title">JOKER</div>
                    <div id="joker-list" class="joker-list">
                        <!-- Joker werden dynamisch hinzugefügt -->
                    </div>
                </div>
            </div>

            <!-- Touch Controls -->
            <div id="touch-controls">
                <button class="touch-btn" id="btn-left">◀</button>
                <button class="touch-btn" id="btn-rotate">↻</button>
                <button class="touch-btn" id="btn-down">▼</button>
                <button class="touch-btn" id="btn-right">▶</button>
            </div>
        </div>

        <!-- Pause Screen -->
        <div id="pause-screen" class="screen overlay">
            <div class="overlay-content">
                <h2>⏸️ Pause</h2>
                <button id="resume-button" class="game-button">▶ Weiter</button>
                <button id="restart-button" class="game-button secondary">🔄 Neustart</button>
                <button id="menu-button" class="game-button secondary">🏠 Menü</button>
            </div>
        </div>

        <!-- Game Over Screen -->
        <div id="gameover-screen" class="screen overlay">
            <div class="overlay-content gameover-content">
                <h2>Game Over!</h2>
                <div class="final-score">
                    <span>Dein Score:</span>
                    <span id="final-score-value" class="big-score">0</span>
                </div>

                <!-- Name Input (nur bei Top 10) -->
                <div id="name-input-section" class="name-input-section hidden">
                    <div class="top10-message">🎉 Du bist in den Top 10! 🎉</div>
                    <div class="name-input-wrapper">
                        <input
                            type="text"
                            id="player-name-input"
                            class="player-name-input"
                            placeholder="Dein Name..."
                            maxlength="10"
                            autocomplete="off"
                        >
                        <button id="save-score-button" class="save-score-btn">Speichern</button>
                    </div>
                </div>

                <!-- Leaderboard -->
                <div class="leaderboard-container" id="gameover-leaderboard">
                    <h3 class="leaderboard-title">🏆 Top 10</h3>
                    <div class="leaderboard-list" id="gameover-leaderboard-list">
                        <!-- Wird dynamisch gefüllt -->
                    </div>
                </div>

                <div class="gameover-buttons">
                    <button id="play-again-button" class="game-button">🔄 Nochmal spielen</button>
                    <button id="back-to-menu-button" class="game-button secondary">🏠 Zum Menü</button>
                </div>
            </div>
        </div>
    </div>

    <script src="js/auth.js"></script>
    <script src="js/sounds.js"></script>
    <script src="js/particles.js"></script>
    <script src="js/game.js"></script>
    <script src="js/controls.js"></script>
    <script src="js/app.js"></script>

    <script>
        // Service Worker registrieren
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('Service Worker registriert'))
                    .catch(err => console.log('Service Worker Fehler:', err));
            });
        }
    </script>
</body>
</html>
